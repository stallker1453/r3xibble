<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117"><title>Halı Saha Grubu</title>
<style>
:root{--bg:#070b10;--panel:#101820;--panel2:#0c131a;--line:#22303a;--text:#f4f7fa;--muted:#8d9aa5;--green:#39e58c;--green2:#0d6b40;--red:#ff7373;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17303a 0,#070b10 40%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{width:min(680px,100%);margin:auto;min-height:100vh;padding-bottom:34px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:rgba(7,11,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05)}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.ball{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#12231c;font-size:20px}.sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
main{padding:14px}.card{background:linear-gradient(180deg,rgba(17,26,34,.98),rgba(12,19,25,.98));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 12px 30px rgba(0,0,0,.14)}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.title{font-size:24px;font-weight:900;margin:4px 0 5px}.muted{color:var(--muted);font-size:13px}.match{display:flex;justify-content:space-between;gap:15px;align-items:center}.datebox{min-width:78px;text-align:center;padding:12px;border-radius:16px;background:#0b171e;border:1px solid var(--line)}.datebox b{display:block;font-size:26px}.datebox span{font-size:11px;color:var(--muted)}
.form{display:grid;gap:9px}select,input{width:100%;font:inherit;background:#0a1117;color:var(--text);border:1px solid #2a3a44;border-radius:13px;padding:12px;outline:none}select:focus,input:focus{border-color:#3e6876}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px;cursor:pointer}.primary{background:var(--green);color:#042012}.dark{background:#1a2730;color:var(--text)}.danger{background:#3a1e23;color:#ffb3b3}.small{padding:9px 11px;font-size:12px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#091116;border:1px solid var(--line);border-radius:16px;padding:12px}.team.white{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.team.black{background:#070b0e}.team h3{margin:0 0 8px;font-size:15px}.count{float:right;color:var(--muted);font-size:11px;font-weight:700}.player{display:flex;align-items:center;gap:8px;padding:9px 3px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.player:last-child{border-bottom:0}.avatar{width:27px;height:27px;border-radius:9px;background:#17252d;display:grid;place-items:center;font-size:10px;font-weight:900;color:#dce6ea;flex:none}.empty{color:var(--muted);font-size:12px;padding:9px 3px}.bench-list{margin-top:10px}.pill{margin-left:auto;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.green{background:#0d4d31;color:#83ffc0}.red{background:#4a2228;color:#ffaaa9}.gray{background:#202b32;color:#bdc8cd}.yellow{background:#4c3b16;color:#ffdf8b}.notice{display:flex;gap:9px;padding:12px;border-radius:14px;background:#10212a;border:1px solid #21404b;color:#b9c8ce;font-size:12px;line-height:1.45}.footer{text-align:center;color:#65747d;font-size:11px;padding:8px}
@media(max-width:480px){.teams{grid-template-columns:1fr}.match{align-items:flex-start}.title{font-size:21px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="ball">⚽</div><div>Halı Saha Grubu<div class="sub">Haftalık kadro ve katılım</div></div></div><button class="btn dark small" onclick="load()">↻</button></header>
<main id="app"><div class="card">Yükleniyor...</div></main>
<script>
let state=null,lineup=null;
const $=id=>document.getElementById(id);
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
async function load(){try{state=await api('/api/state');lineup=await api('/api/lineup');render()}catch(e){$('app').innerHTML=`<div class="card"><b>Bağlantı hatası</b><p class="muted">${e.message}</p><button class="btn primary" onclick="load()">Tekrar dene</button></div>`}}
function initials(n){return n.split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function playerRow(p){return `<div class="player"><div class="avatar">${initials(p.name)}</div><span>${p.name}</span></div>`}
function statusFor(p){const a=state.attendance.find(x=>x.player_id===p.id);return a?.status==='yes'?['Geliyor','green']:a?.status==='no'?['Gelmiyor','red']:['Cevap yok','gray']}
function render(){const w=state.week;const d=new Date(w.match_date+'T12:00:00');const day=d.toLocaleDateString('tr-TR',{weekday:'short'}).replace('.','');
$('app').innerHTML=`
<div class="card"><div class="match"><div><div class="eyebrow">Bu haftaki maç</div><div class="title">${w.match_time} · ${w.location}</div><div class="muted">📅 ${d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})} · ${day}</div></div><div class="datebox"><b>${String(d.getDate()).padStart(2,'0')}</b><span>${d.toLocaleDateString('tr-TR',{month:'short'}).replace('.','')}</span></div></div></div>
<div class="card"><div class="section-head"><div><div class="eyebrow">Katılım bildirimi</div><div style="font-weight:900;margin-top:3px">Maça geliyor musun?</div></div></div><div class="form"><select id="who"><option value="">Oyuncunu seç</option>${state.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><select id="team"><option value="any">Takım tercihi: Fark etmez</option><option value="white">⚪ Beyaz</option><option value="black">⚫ Siyah</option></select><div class="grid"><button class="btn primary" onclick="attend('yes')">✓ Geliyorum</button><button class="btn dark" onclick="attend('no')">✕ Gelemiyorum</button></div></div></div>
<div class="card"><div class="section-head"><div><div class="eyebrow">Otomatik kadro</div><div style="font-weight:900;margin-top:3px">14 kişilik kadro</div></div><span class="pill ${lineup.white.length+lineup.black.length===14?'green':'yellow'}">${lineup.white.length+lineup.black.length}/14</span></div>
<div class="teams"><div class="team white"><h3>⚪ Beyaz <span class="count">${lineup.white.length}/7</span></h3>${lineup.white.length?lineup.white.map(playerRow).join(''):'<div class="empty">Henüz oyuncu yok</div>'}</div><div class="team black"><h3>⚫ Siyah <span class="count">${lineup.black.length}/7</span></h3>${lineup.black.length?lineup.black.map(playerRow).join(''):'<div class="empty">Henüz oyuncu yok</div>'}</div></div>
<div class="bench-list"><div class="section-head"><b>🪑 Yedekler</b><span class="muted">${lineup.bench.length} kişi</span></div>${lineup.bench.length?lineup.bench.map((p,i)=>`<div class="player"><span style="width:20px;color:var(--muted)">${i+1}.</span><div class="avatar">${initials(p.name)}</div><span>${p.name}</span><span class="pill ${i===0?'green':'gray'}">${i===0?'Sıradaki':'Bekliyor'}</span></div>`).join(''):'<div class="empty">Şu an yedek yok.</div>'}</div></div>
<button class="btn dark" style="width:100%;margin-bottom:12px" onclick="shareWhatsApp()">📲 WhatsApp grubunda paylaş</button><div class="notice">💡 <span>Bir oyuncu gelemezse, yedek sırasındaki ilk kişi otomatik olarak kadroya girer. Sıralama önceki katılım sayılarını da dikkate alır.</span></div>
<div class="card"><div class="section-head"><div><div class="eyebrow">Katılım durumu</div><div style="font-weight:900;margin-top:3px">Oyuncular</div></div></div>${state.players.map(p=>{const s=statusFor(p);return `<div class="player"><div class="avatar">${initials(p.name)}</div><span>${p.name}</span><span class="pill ${s[1]}">${s[0]}</span></div>`}).join('')}</div>
<div class="card"><div class="section-head"><div><div class="eyebrow">Yönetici</div><div style="font-weight:900;margin-top:3px">Oyuncu ekle</div></div></div><div class="form"><input id="key" type="password" placeholder="Yönetici anahtarı"><input id="newname" placeholder="Yeni oyuncunun adı"><button class="btn primary" onclick="addPlayer()">+ Oyuncu ekle</button></div></div>
<div class="footer">Halı Saha Grubu · Online MVP</div>`}
async function attend(status){const id=$('who').value;if(!id)return alert('Önce oyuncunu seç.');try{await api('/api/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player_id:Number(id),status,team:$('team').value})});await load();alert(status==='yes'?'Katılımın kaydedildi.':'Gelemez olarak kaydedildi.')}catch(e){alert(e.message)}}
function shareWhatsApp(){const w=state.week;const text=`⚽ Halı saha maçı\n📅 ${new Date(w.match_date+'T12:00:00').toLocaleDateString('tr-TR')}\n🕘 ${w.match_time}\n📍 ${w.location}\n\nKatılımını buradan bildir: ${location.href}`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
async function addPlayer(){const key=$('key').value,name=$('newname').value.trim();if(!key||!name)return alert('Anahtar ve isim gerekli.');try{await api('/api/admin/players',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({name})});await load();alert('Oyuncu eklendi.')}catch(e){alert(e.message)}}
load();
</script></div></body></html>
